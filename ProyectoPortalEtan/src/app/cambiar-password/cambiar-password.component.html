<div class="cambiar-password-container">
  <form (ngSubmit)="enviarRecuperacion()">
    <input type="email" [(ngModel)]="email" name="email" placeholder="Correo electrónico" required>
    <button type="submit" [disabled]="cargando" id="submit_reg">Enviar enlace de recuperación</button>
  </form>
  <div class="mensaje" *ngIf="mensaje">{{ mensaje }}</div>
</div>
