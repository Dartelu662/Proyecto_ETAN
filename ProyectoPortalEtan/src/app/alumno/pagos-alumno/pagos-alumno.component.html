
<div class="payment-container">
  <h2>Pago de Mensualidad</h2>

  <label for="matricula">Matrícula del Alumno:</label>
  <input
    type="text"
    id="matricula"
    [(ngModel)]="EdoCuenta.Matricula"
    name="matricula"
    readonly
  />

  <label for="mensualidad">Monto a Pagar:</label>
  <input
    type="number"
    id="mensualidad"
    [(ngModel)]="EdoCuenta.MontoMensual"
    name="mensualidad"
    readonly
  />

  <div #paypalButtonContainer></div>
</div>
