<div class="datos-alumno-container">
    <h2>Datos Generales del Alumno</h2>
    <div class="datos-grid">
      <div class="dato">
        <label>Matrícula:</label>
        <span>{{ alumno.matricula }}</span>
      </div>
      <div class="dato nombre-completo">
        <label>Nombre Completo:</label>
        <span>{{ nombreCompleto }}</span>
      </div>
      <div class="dato">
        <label>Correo Principal:</label>
        <span>{{ alumno.correo1 }}</span>
      </div>
      <div class="dato">
        <label>Correo Secundario:</label>
        <span>{{ alumno.correo2 }}</span>
      </div>
      <div class="dato">
        <label>Celular:</label>
        <span>{{ alumno.celular }}</span>
      </div>
      <div class="dato direccion">
        <label>Dirección:</label>
        <span>{{ alumno.direccion }}</span>
      </div>
      <div class="dato">
        <label>Fecha de Nacimiento:</label>
        <span>{{ formatDate(alumno.fechaNacimiento) }}</span>
      </div>
      <div class="dato">
        <label>Fecha de Fin de Permiso de Formación:</label>
        <span>{{ formatDate(alumno.fechaFinPermiso) }}</span>
      </div>
    </div>
  </div>
