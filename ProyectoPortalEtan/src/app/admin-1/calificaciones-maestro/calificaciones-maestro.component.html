<div *ngIf="!selectedGrupo">
  <form [formGroup]="maestroForm">
    <label for="maestro">Selecciona un Maestro:</label>
    <select id="maestro" formControlName="maestroId">
      <option value="">-- Maestro --</option>
      <option *ngFor="let m of listaMaestros" [value]="m.id">
        {{ m.Nombres }} {{ m.ApellidoP }} {{ m.ApellidoM }}
      </option>
    </select>
  </form>

  <h2 *ngIf="grupos.length">Grupos</h2>
  <div class="tarjetas">
    <div *ngFor="let g of grupos" class="tarjeta" (click)="seleccionarGrupo(g)">
      <h3>{{ g.materia }}</h3>
      <p>Plan: {{ g.planEstudio }}</p>
      <p>Examen: {{ g.fechaExamen }}</p>
    </div>
  </div>
</div>

<div *ngIf="selectedGrupo">
  <button (click)="regresarALista()">← Volver a grupos</button>
  <h2>{{ selectedGrupo.materia }} — {{ selectedGrupo.planEstudio }}</h2>

  <table>
    <thead>
      <tr>
        <th>Matrícula</th>
        <th>Calificación</th>
        <th>Fecha</th>
        <th>Hora</th>
        <th *ngIf="selectedGrupo.edicionHabilitada">Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of selectedGrupo.alumnos">
        <td>{{ a.matricula }}</td>
        <td>
          <input *ngIf="selectedGrupo.edicionHabilitada"
                 type="number" min="0" max="100"
                 [value]="a.calificacion"
                 (input)="actualizarCalificacion(a, $event)">
          <span *ngIf="!selectedGrupo.edicionHabilitada">{{ a.calificacion }}</span>
        </td>
        <td>{{ a.fechaActualizacion || '-' }}</td>
        <td>{{ a.horaActualizacion  || '-' }}</td>
        <td *ngIf="selectedGrupo.edicionHabilitada">
          <button (click)="actualizarCalificacion(a, $event)">Guardar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <button *ngIf="selectedGrupo.edicionHabilitada"
          (click)="bloquearEdicion()">
    Bloquear edición
  </button>
</div>
