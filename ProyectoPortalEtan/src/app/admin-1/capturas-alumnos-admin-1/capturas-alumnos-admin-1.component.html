<div class="container">
    <div class="actions-row" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 class="title">Captura de Alumnos</h3>
  
      <!-- Botón Nuevo: limpia el formulario y prepara para captura -->
      <button type="button" class="btn btn-primary" (click)="abrirNuevoAlumno()">
        Nuevo alumno
      </button>
    </div>
  
    <!-- ── Formulario Nuevo Alumno / EdoCuenta ─────────────────────────────── -->
    <form (ngSubmit)="Guardar()" #alumnoForm="ngForm">
      <div class="form-group linea1">
        <label>Matrícula</label>
        <input type="text" class="form-control"
               [(ngModel)]="usuario.UserName"
               (change)="validarMatricula()"
               name="matricula"
               required>
      </div>

      <!-- Mensaje de validación -->
      <div *ngIf="mensajeValidacion" 
           [ngClass]="{'alert alert-warning': matriculaExiste, 'alert alert-success': !matriculaExiste}"
           style="margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; font-size: 14px;">
        {{ mensajeValidacion }}
      </div>

     <!-- CONTRASEÑA DEL ALUMNO -->
      <div class="form-group linea3">
        <label>Contraseña</label>
        <input type="password" class="form-control"
               [(ngModel)]="usuario.Password"
               name="passwordAlumno"
               autocomplete="new-password"
               required>
      </div>

      <!-- Datos personales -->
      <div class="form-group linea2">
        <label>Nombres</label>
        <input type="text" class="form-control"
               [(ngModel)]="usuario.Nombres"
               (input)="buscarUsuariosPorNombre(usuario.Nombres)"
               name="nombres"
               required>
      </div>

    <!-- Lista de sugerencias -->
    <ul *ngIf="usuariosSugeridos?.length" class="sugerencias">
      <li *ngFor="let u of usuariosSugeridos" class="sugerencia-item" (click)="seleccionarUsuario(u)">
        <div class="sugerencia-main">
          <strong>{{ u.Nombres }} {{ u.ApellidoP }} {{ u.ApellidoM }}</strong>
          <span class="muted"> ({{ u.UserName }})</span>
        </div>
        <div class="sugerencia-sub">
          <small class="muted">{{ u.Email || '' }} {{ u.Celular ? '· ' + u.Celular : '' }}</small>
        </div>
      </li>
    </ul>

      <div class="form-group linea2">
        <label>Apellido Paterno</label>
        <input type="text" class="form-control"
               [(ngModel)]="usuario.ApellidoP"
               name="apellidoP"
               required>
      </div>
      <div class="form-group linea2">
        <label>Apellido Materno</label>
        <input type="text" class="form-control"
               [(ngModel)]="usuario.ApellidoM"
               name="apellidoM"
               required>
      </div>
  
      <!-- Contacto -->
      <div class="form-group linea3">
        <label>Email</label>
        <input type="email" class="form-control"
               [(ngModel)]="usuario.Email"
               name="email"
               required>
      </div>

       <div class="form-group linea3">
        <label>Celular</label>
        <input type="text" class="form-control"
               [(ngModel)]="usuario.Celular"
               name="celular"
               required>
      </div>
      <div class="form-group linea3">
        <label>Dirección</label>
        <input type="text" class="form-control"
               [(ngModel)]="usuario.Direccion"
               name="direccion">
      </div>
  
      <!-- Fechas y permiso -->
      <div class="form-group linea4">
        <label>Fecha Nac.</label>
        <input type="date" class="form-control"
               [(ngModel)]="usuario.FechaNac"
               name="fechaNac"
               required>
      </div>
      <div class="form-group linea4">
        <label>Fecha Ingreso</label>
        <input type="date" class="form-control"
               [(ngModel)]="usuario.FechaIngreso"
               name="fechaIngreso"
               required>
      </div>
      <div class="form-group linea4">
        <label>Permiso Formación</label>
        <input type="text" class="form-control"
               [(ngModel)]="alumno.PermisoFormacion"
               name="permisoFormacion"
               >
      </div>
      <div class="form-group linea4">
        <label>Fecha Fin Formación</label>
        <input type="date" class="form-control"
               [(ngModel)]="alumno.FechaFinPF"
               name="fechaFinPF"
               >
      </div>
  
      <!-- Plan / Curso -->
      <div class="form-group linea5">
        <label>Plan</label>
        <select class="form-control"
                [(ngModel)]="selectPlan"
                name="listaPlanes"
                (change)="onPlanSelected(selectPlan)"
                required>
          <option *ngFor="let p of listaPlanes" [value]="p.id">{{p.plan}}</option>
        </select>
      </div>
      <div class="form-group linea5">
        <label>Curso</label>
        <select class="form-control"
                [(ngModel)]="selectCurso"
                name="listaCursos"
                (change)="onCursoSelected(selectCurso)"
                required>
          <option *ngFor="let c of listaCursos" [value]="c.id">{{c.curso}}</option>
        </select>
      </div>
  
      <!-- Modalidad -->
      <div class="form-group linea6">
        <label>Modalidad</label>
        <select class="form-control"
                [(ngModel)]="modalidad"
                name="modalidad"
                required>
          <option value="" disabled>-- Elige modalidad --</option>
          <option value="Semanal">Semanal</option>
          <option value="Sabatino">Sabatino</option>
        </select>
      </div>
  
      <button type="submit"
              class="btn btn-primary"
              [disabled]="!alumnoForm.form.valid">
        Guardar
      </button>
    </form>
  
    <hr>
  
    <!-- ── Buscar y editar Alumno existente ──────────────────────────────────── -->
    <form (ngSubmit)="buscarAlumno()" class="mt-4">
      <div class="form-group">
        <label>Buscar Matrícula</label>
        <input type="text" class="form-control"
               [(ngModel)]="matriculaBusqueda"
               name="matriculaBusqueda"
               required>
      </div>
      <button class="btn btn-secondary">Buscar</button>
    </form>
  
    <div *ngIf="alumnoSeleccionado" class="card mt-3 p-3">
      <h4>Editar Alumno {{ alumnoSeleccionado.usuario.UserName }}</h4>
      <form (ngSubmit)="actualizarAlumno()">
        <div class="form-group">
          <label>Nombre</label>
          <input class="form-control"
                 [(ngModel)]="alumnoSeleccionado.usuario.Nombres"
                 name="editNombres" required>
        </div>
        <div class="form-group">
          <label>Apellido Paterno</label>
          <input class="form-control"
                 [(ngModel)]="alumnoSeleccionado.usuario.ApellidoP"
                 name="editApellidoP" required>
        </div>
        <div class="form-group">
          <label>Apellido Materno</label>
          <input class="form-control"
                 [(ngModel)]="alumnoSeleccionado.usuario.ApellidoM"
                 name="editApellidoM" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control"
                 [(ngModel)]="alumnoSeleccionado.usuario.Email"
                 name="editEmail" required>
        </div>
        <div class="form-group">
          <label>Dirección</label>
          <input class="form-control"
                 [(ngModel)]="alumnoSeleccionado.usuario.Direccion"
                 name="editDireccion">
        </div>
        <div class="form-group">
          <label>Celular</label>
          <input class="form-control"
                 [(ngModel)]="alumnoSeleccionado.usuario.Celular"
                 name="editCelular">
        </div>
        <div class="form-group">
          <label>Permiso Formación</label>
          <input class="form-control"
                 [(ngModel)]="alumnoSeleccionado.alumno.PermisoFormacion"
                 name="editPermisoFormacion" required>
        </div>
        <div class="form-group">
          <label>Fecha Fin Formación</label>
          <input type="date" class="form-control"
                 [(ngModel)]="alumnoSeleccionado.alumno.FechaFinPF"
                 name="editFechaFinPF" required>
        </div>
  
        <button type="submit" class="btn btn-success">Actualizar</button>
        <button type="button"
                class="btn btn-danger ml-2"
                (click)="deshabilitarAlumno()">
          Deshabilitar
        </button>
        <button type="button"
                class="btn btn-outline-secondary ml-2"
                (click)="cancelarEdicion()">
          Cancelar
        </button>
      </form>
    </div>
  </div>
