<div class="container">
  <!-- PLANES -->
  <h2>Planes</h2>
  <div *ngFor="let plan of planes" class="registro-item">
    <input [(ngModel)]="plan.plan" placeholder="Nombre del Plan" class="input-field">
    <input type="date" [(ngModel)]="plan.FechaIni" class="input-field">
    <input type="date" [(ngModel)]="plan.FechaFin" class="input-field">
    <button (click)="actualizarPlan(plan)" class="btn">Actualizar</button>
    <button (click)="eliminarPlan(plan)" class="btn">Eliminar</button>
  </div>

  <h3>Agregar Nuevo Plan</h3>
  <form (ngSubmit)="agregarPlan()">
    <input type="text" [(ngModel)]="nuevoPlan.plan" name="nombrePlan" placeholder="Nombre del Plan" class="input-field" required>
    <input type="date" [(ngModel)]="nuevoPlan.FechaIni" name="fechaIniPlan" class="input-field" required>
    <input type="date" [(ngModel)]="nuevoPlan.FechaFin" name="fechaFinPlan" class="input-field" required>
    <button type="submit" class="btn">Agregar Plan</button>
  </form>

  <hr>

  <!-- CURSOS -->
  <h2>Cursos</h2>
  <div *ngFor="let curso of cursos" class="registro-item">
    <input [(ngModel)]="curso.curso" placeholder="Nombre del Curso" class="input-field">
    <input [(ngModel)]="curso.Semanal" placeholder="Mod. Semanal" class="input-field">
    <input [(ngModel)]="curso.Sabatino" placeholder="Mod. Sabatino" class="input-field">
    <input [(ngModel)]="curso.hrsvuelo" placeholder="Horas Vuelo" class="input-field">
    <input type="date" [(ngModel)]="curso.FechaCursoIni" class="input-field">
    <input type="date" [(ngModel)]="curso.FechaCursoFin" class="input-field">
    <button (click)="actualizarCurso(curso)" class="btn">Actualizar</button>
    <button (click)="eliminarCurso(curso.curso)" class="btn">Eliminar</button>
  </div>

  <h3>Agregar Nuevo Curso</h3>
  <form (ngSubmit)="agregarCurso()">
    <input type="text" [(ngModel)]="nuevoCurso.curso" name="nombreCurso" placeholder="Nombre del Curso" class="input-field" required>
    <input type="text" [(ngModel)]="nuevoCurso.Semanal" name="Semanal" placeholder="Semanal" class="input-field" required>
    <input type="text" [(ngModel)]="nuevoCurso.Sabatino" name="Sabatino" placeholder="Sabatino" class="input-field" required>
    <input type="text" [(ngModel)]="nuevoCurso.hrsvuelo" name="hrsvuelo" placeholder="Horas Vuelo" class="input-field" required>
    <input type="date" [(ngModel)]="nuevoCurso.FechaCursoIni" name="fechaIniCurso" class="input-field" required>
    <input type="date" [(ngModel)]="nuevoCurso.FechaCursoFin" name="fechaFinCurso" class="input-field" required>
    <button type="submit" class="btn">Agregar Curso</button>
  </form>

  <hr>

  <!-- MATERIAS -->
  <h2>Materias</h2>
  <div *ngFor="let materia of materias" class="registro-item">
    <input [(ngModel)]="materia.Materia" placeholder="Materia" class="input-field">

    <select [(ngModel)]="materia.plan" class="input-field">
      <option *ngFor="let plan of planes" [value]="plan.plan">{{ plan.plan }}</option>
    </select>

    <select [(ngModel)]="materia.curso" class="input-field">
      <option *ngFor="let curso of cursos" [value]="curso.curso">{{ curso.curso }}</option>
    </select>

    <select [(ngModel)]="materia.idMaestro" class="input-field">
      <option *ngFor="let maestro of listaMaestros" [value]="maestro.id">
        {{ maestro.Nombres }} {{ maestro.ApellidoP }} {{ maestro.ApellidoM }}
      </option>
    </select>

    <button (click)="actualizarMateria(materia)" class="btn">Actualizar</button>
    <button (click)="eliminarMateria(materia.id)" class="btn">Eliminar</button>
  </div>

  <h3>Agregar Nueva Materia</h3>
  <form (ngSubmit)="agregarMateria()">
    <input type="text" [(ngModel)]="nuevaMateria.Materia" name="Materia" placeholder="Materia" class="input-field" required>

    <select [(ngModel)]="selectPlan" name="planes" (change)="onPlanSelected(selectPlan)" class="input-field" required>
      <option *ngFor="let plan of planes" [value]="plan.id">{{ plan.plan }}</option>
    </select>

    <select [(ngModel)]="selectCurso" name="Cursos" (change)="onCursoSelected(selectCurso)" class="input-field" required>
      <option *ngFor="let curso of cursos" [value]="curso.id">{{ curso.curso }}</option>
    </select>

    <select [(ngModel)]="selectedMaestro" name="listaMaestros" (change)="onMaestroSelected(selectedMaestro)" class="input-field" required>
      <option *ngFor="let maestro of listaMaestros" [value]="maestro.id">
        {{ maestro.Nombres }} {{ maestro.ApellidoP }} {{ maestro.ApellidoM }}
      </option>
    </select>

    <button type="submit" class="btn">Agregar Materia</button>
  </form>
</div>

<style>
  .registro-item {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
  }

  .input-field {
    padding: 6px;
    font-size: 14px;
    width: 180px;
  }

  .btn {
    padding: 6px 12px;
    font-size: 14px;
    cursor: pointer;
  }

  hr {
    margin: 30px 0;
  }
</style>
